apiVersion: v1
kind: Secret
metadata:
  name: go-multi-agent-secrets
  labels:
    app.kubernetes.io/part-of: go-multi-agent-v2
type: Opaque
stringData:
  # ⚠️ 以下为占位符！生产环境务必替换为真实随机值，并改用
  #    sealed-secrets / external-secrets / CSI 驱动注入，切勿把真实密钥提交进仓库。
  # 生成示例：openssl rand -hex 32
  JWT_SECRET: "REPLACE_ME_JWT_32plus_hex"
  PROVIDER_ENC_KEY: "REPLACE_ME_ENC_32plus_hex"
