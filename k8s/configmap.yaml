apiVersion: v1
kind: ConfigMap
metadata:
  name: go-multi-agent-config
  labels:
    app.kubernetes.io/part-of: go-multi-agent-v2
data:
  # ---- 网络 / 路径（与 docker-compose 对齐）----
  PORT: "8080"
  DB_PATH: "/data/codeagent.db"
  WORKSPACE_ROOT: "/data/workspaces"
  ARTIFACT_ROOT: "/data/agent-state"
  SKILLS_DATA_DIR: "/data/skills"
  SKILLS_ROOT: "/app/skills"          # 由 gen-skills-configmap.sh 生成的 ConfigMap 挂载
  # ---- 运行模式 / 编排 ----
  RUN_MODE: "unattended"              # 24h 自主平台安全默认
  AGENT_MODE: "single"
  GOAL_CONTRACT: "true"
  PLAN_EXECUTE: "true"
  # ---- 护栏 / 企业化开关 ----
  METRICS_ENABLED: "true"
  STATE_ENABLED: "true"
  BUDGET_ENABLED: "true"
  CHECKPOINT_ENABLED: "true"
  TOOL_SEARCH_ENABLED: "true"
  KNOWLEDGE_ENABLED: "true"
  SKILL_WARM_START: "true"
  # ---- 跨域：ingress 同主机访问时为同源，无需跨域；如前端独立域名请改为真实源 ----
  CORS_ALLOWED_ORIGINS: "https://agent.example.com"
  # 告警/可观测相关（沿用应用默认，可在此覆盖）
  WEBHOOK_RATE_LIMIT: "10"
