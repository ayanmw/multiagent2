apiVersion: v1
kind: Service
metadata:
  # ⚠️ 名称必须为 server：前端 web/nginx.conf 写死 http://server:8080 反代后端，
  # 保持该名称后端 DNS 才能被前端容器正确解析（同命名空间内 server:<port>）。
  name: server
  labels:
    app.kubernetes.io/part-of: go-multi-agent-v2
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
