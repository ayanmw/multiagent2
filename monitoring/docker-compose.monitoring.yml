# 本地可观测性编排（M7-04 + M7-05）
#
# 一键拉起 Prometheus + Alertmanager + Grafana，对接本机已运行的后端（默认 :8080 暴露 /metrics）。
# 用法：
#   1) 先在本机启动后端（METRICS_ENABLED=true，默认开）：`cd server && go run ./cmd/server`
#   2) 把 monitoring/prometheus.yml 的 scrape 目标由 `server:8080` 改为 `host.docker.internal:8080`
#      （或将后端也纳入同一 compose）。
#   3) 在本目录执行：`docker compose -f docker-compose.monitoring.yml up -d`
#   4) 打开 http://localhost:9090 （Prometheus）→ Status > Targets 确认 backend 为 UP；
#      http://localhost:9093 （Alertmanager）→ 查看路由与告警；
#      http://localhost:3000 （Grafana，默认 admin/admin）→ 自动加载 monitoring/grafana 下的
#      「CodeAgent 运行监控概览」看板（M7-05）。首次登录请改密码或禁用匿名。
#
# 触发演示：人为制造高错误率后，约 2m 内 Prometheus 触发 CodeAgentHighLLMErrorRate，
# Alertmanager 推送至 http://host.docker.internal:8080/api/alerts，后端把告警写入通知中心。

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: codeagent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: codeagent-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: codeagent-grafana
    ports:
      - "3000:3000"
    environment:
      # 默认 admin/admin；生产请改 GF_SECURITY_ADMIN_PASSWORD 或启用匿名只读。
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # 看板与数据源自动供应（见 monitoring/grafana/provisioning）。
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
